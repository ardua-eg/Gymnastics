<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CRM dashboard – Gymnastics wear in Egy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{background:#F7F2FB}
.nav{text-align:left;border:0;cursor:pointer;font:600 15px 'Inter',sans-serif;padding:12px 14px;border-radius:12px;min-height:44px;background:transparent;color:#fff}
.nav.on{background:#FFC20E;color:#2A1440}
.card{background:#fff;border-radius:16px;padding:24px}
h2{margin:0;font-family:'Fredoka',sans-serif;font-size:22px}
.pill{border:0;cursor:pointer;font:600 14px 'Inter',sans-serif;padding:10px 16px;border-radius:999px;min-height:44px;background:#EFE6F7;color:#2A1440}
.pill.on{background:#6B2D8F;color:#fff}
.adv{margin-top:6px;border:0;cursor:pointer;background:#C71F66;color:#fff;font:600 14px 'Inter',sans-serif;padding:10px 14px;border-radius:999px;min-height:44px}
.crow{display:flex;gap:16px;align-items:center;text-align:left;width:100%;border:0;border-top:1px solid #E6DAF1;background:#fff;padding:14px 8px;cursor:pointer;font:400 15px 'Inter',sans-serif;color:#2A1440;min-height:44px}
.crow.on{background:#F1E7F8}
.empty{color:#4A3860;font-size:15px;padding:8px 0}
</style>
</head>
<body>
<div style="min-height:100vh;display:flex;flex-wrap:wrap">
<aside style="flex:1 1 240px;max-width:260px;min-width:220px;background:#2A1440;color:#fff;padding:28px 20px;display:flex;flex-direction:column;gap:28px">
<div style="font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;line-height:1.15">Gymnastics wear in Egy<div style="font-family:Inter,sans-serif;font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#D9CBE8;margin-top:6px">CRM</div></div>
<div id="nav" style="display:flex;flex-direction:column;gap:6px"></div>
<a href="index.html" style="color:#D9CBE8;font-size:14px;text-decoration:none">Back to website</a>
</aside>
<main style="flex:999 1 560px;min-width:0;padding:32px;display:flex;flex-direction:column;gap:24px">
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between">
<h1 id="h" style="margin:0;font-family:'Fredoka',sans-serif;font-weight:700;font-size:34px"></h1>
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span id="stamp" style="font-size:13px;color:#4A3860"></span><button class="pill" id="refresh">Refresh</button></div>
</div>
<div id="status" role="status" style="font-size:15px"></div>
<div id="view"></div>
</main>
</div>
<script>
var STAGES=[{k:'lead',l:'New request',c:'#6B2D8F',t:'#E6DAF1'},{k:'quoted',l:'Quote sent',c:'#F7941D',t:'#FFE3BF'},{k:'ordered',l:'Confirmed',c:'#D6246E',t:'#F9D0E1'},{k:'delivered',l:'Delivered',c:'#2A7A1E',t:'#D5EFC9'}];
var TITLES={overview:'Overview',pipeline:'Orders pipeline',customers:'Customers'};
var ORDERS=[],CUST=[],S={section:'overview',search:'',type:'All',sel:null};
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var st=function(k){return STAGES.filter(function(x){return x.k===k})[0]||STAGES[0]};
var key=function(o){return o.phone.replace(/\D/g,'')};
var when=function(iso){var d=new Date(iso);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})};
var wa=function(p){var n=p.replace(/\D/g,'');if(n.charAt(0)==='0')n='20'+n.slice(1);return 'https://wa.me/'+n};

function build(){
  var m={};
  ORDERS.slice().reverse().forEach(function(o){
    var k=key(o);
    if(!m[k])m[k]={id:k,name:o.name,phone:o.phone,city:o.city,type:o.type,orders:[]};
    m[k].name=o.name;m[k].city=o.city||m[k].city;m[k].type=o.type;m[k].orders.push(o);
  });
  CUST=Object.keys(m).map(function(k){m[k].orders.reverse();return m[k]}).sort(function(a,b){return a.orders[0].createdAt<b.orders[0].createdAt?1:-1});
  if(!S.sel||!m[S.sel])S.sel=CUST.length?CUST[0].id:null;
}
function load(){
  $('status').style.color='#4A3860';$('status').textContent='Loading...';
  return fetch('/api/orders',{cache:'no-store'}).then(function(r){
    if(r.status===401){throw new Error('Staff login required. Reload the page and sign in.')}
    if(r.status===503){throw new Error('Orders storage is not set up yet. See the README for the setup steps.')}
    if(!r.ok)throw new Error('Could not load orders.');
    return r.json();
  }).then(function(j){
    ORDERS=j.orders||[];build();$('status').textContent='';
    $('stamp').textContent='Updated '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});render();
  }).catch(function(e){$('status').style.color='#B00020';$('status').textContent=e.message;render();});
}
function nav(){$('nav').innerHTML=Object.keys(TITLES).map(function(k){return '<button class="nav'+(S.section===k?' on':'')+'" data-go="'+k+'">'+TITLES[k]+'</button>'}).join('')}

function overview(){
  var week=Date.now()-7*864e5;
  var open=ORDERS.filter(function(o){return o.stage!=='delivered'}).length;
  var k=[['Customers',CUST.length,'#6B2D8F'],['New requests',ORDERS.filter(function(o){return o.stage==='lead'}).length,'#F7941D'],['Open orders',open,'#D6246E'],['Delivered',ORDERS.filter(function(o){return o.stage==='delivered'}).length,'#2A7A1E'],['Requests in last 7 days',ORDERS.filter(function(o){return new Date(o.createdAt).getTime()>week}).length,'#FFC20E']];
  var h='<div style="display:flex;flex-direction:column;gap:24px"><div style="display:flex;flex-wrap:wrap;gap:16px">'+k.map(function(x){return '<div class="card" style="flex:1 1 170px;border-top:5px solid '+x[2]+'"><div style="font-size:14px;color:#4A3860">'+x[0]+'</div><div style="font-family:Fredoka,sans-serif;font-weight:700;font-size:32px;margin-top:6px">'+x[1]+'</div></div>'}).join('')+'</div>';
  h+='<div class="card" style="display:flex;flex-direction:column;gap:12px"><h2>Latest requests</h2>';
  if(!ORDERS.length)h+='<div class="empty">No order requests yet. They appear here as soon as someone sends one from the shop.</div>';
  else h+='<div style="overflow-x:auto"><div style="min-width:560px">'+ORDERS.slice(0,8).map(function(o){var s=st(o.stage);return '<div style="display:flex;gap:16px;align-items:center;padding:12px 0;border-top:1px solid #E6DAF1;font-size:15px"><div style="flex:3 1 0;font-weight:600">'+esc(o.name)+'</div><div style="flex:3 1 0;color:#4A3860">'+esc(o.product||'General enquiry')+'</div><div style="flex:2 1 0;color:#4A3860">'+when(o.createdAt)+'</div><div style="flex:2 1 0"><span style="background:'+s.t+';padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600">'+s.l+'</span></div></div>'}).join('')+'</div></div>';
  return h+'</div></div>';
}
function pipeline(){
  return '<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">'+STAGES.map(function(s,i){
    var ds=ORDERS.filter(function(o){return o.stage===s.k}),nx=STAGES[i+1];
    return '<div style="flex:1 1 230px;background:#EFE6F7;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;border-top:6px solid '+s.c+'"><div style="font-family:Fredoka,sans-serif;font-weight:600;font-size:18px">'+s.l+' <span style="font-family:Inter,sans-serif;font-size:14px;color:#4A3860;font-weight:500">('+ds.length+')</span></div>'+
    ds.map(function(o){return '<div style="background:#fff;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px"><div style="font-weight:600;font-size:15px">'+esc(o.name)+'</div><div style="font-size:14px;color:#4A3860">'+esc(o.product||'General enquiry')+'</div>'+(o.note?'<div style="font-size:13px;color:#4A3860">'+esc(o.note)+'</div>':'')+'<div style="font-size:13px;color:#4A3860">'+when(o.createdAt)+'</div><a href="'+wa(o.phone)+'" target="_blank" rel="noopener" style="font-size:14px;font-weight:600;color:#2A7A1E">WhatsApp '+esc(o.phone)+'</a>'+(nx?'<button class="adv" data-adv="'+esc(o.id)+'" data-to="'+nx.k+'">Move to: '+nx.l+'</button>':'')+'</div>'}).join('')+(ds.length?'':'<div class="empty">Nothing here</div>')+'</div>';
  }).join('')+'</div>';
}
function customers(){
  var q=S.search.trim().toLowerCase();
  var rows=CUST.filter(function(c){return(S.type==='All'||c.type===S.type)&&(!q||c.name.toLowerCase().indexOf(q)>-1||(c.city||'').toLowerCase().indexOf(q)>-1||c.phone.indexOf(q)>-1)});
  var sc=CUST.filter(function(c){return c.id===S.sel})[0];
  var h='<div style="display:flex;flex-direction:column;gap:16px"><div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center"><label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search customers</label><input id="q" type="text" value="'+esc(S.search)+'" placeholder="Search by name, city or phone" style="flex:1 1 260px;min-height:44px;padding:0 16px;border:2px solid #CDB8E3;border-radius:999px;font:400 15px Inter,sans-serif;color:#2A1440;background:#fff">'+
  ['All','Club','Coach','Athlete','Parent','Retailer'].map(function(t){return '<button class="pill'+(S.type===t?' on':'')+'" data-type="'+t+'">'+t+'</button>'}).join('')+'</div>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start"><div class="card" style="flex:3 1 460px;min-width:0;padding:12px 24px;overflow-x:auto"><div style="min-width:460px">'+
  rows.map(function(c){return '<button class="crow'+(c.id===S.sel?' on':'')+'" data-sel="'+esc(c.id)+'"><span style="flex:4 1 0;font-weight:600">'+esc(c.name)+'</span><span style="flex:2 1 0;color:#4A3860">'+esc(c.type)+'</span><span style="flex:2 1 0;color:#4A3860">'+esc(c.city)+'</span></button>'}).join('')+
  (rows.length?'':'<div class="empty" style="padding:24px 8px">'+(CUST.length?'No customers match.':'No customers yet.')+'</div>')+'</div></div>';
  if(sc){
    h+='<div class="card" style="flex:2 1 300px;display:flex;flex-direction:column;gap:12px;border-top:5px solid #6B2D8F"><h2>'+esc(sc.name)+'</h2><div style="font-size:14px;color:#4A3860">'+esc(sc.type)+(sc.city?' · '+esc(sc.city):'')+'</div><a href="'+wa(sc.phone)+'" target="_blank" rel="noopener" style="font-size:15px;font-weight:600;color:#2A7A1E">WhatsApp '+esc(sc.phone)+'</a><div style="font-weight:600;font-size:15px;margin-top:8px">Orders</div>'+
    sc.orders.map(function(o){return '<div style="display:flex;gap:12px;justify-content:space-between;font-size:14px;border-top:1px solid #E6DAF1;padding-top:8px"><span>'+esc(o.product||'General enquiry')+'<br><span style="color:#4A3860">'+when(o.createdAt)+'</span></span><span style="font-weight:600">'+st(o.stage).l+'</span></div>'}).join('')+'</div>';
  }
  return h+'</div></div>';
}
function render(){
  nav();$('h').textContent=TITLES[S.section];
  var keep=document.activeElement&&document.activeElement.id==='q';
  $('view').innerHTML=S.section==='overview'?overview():S.section==='pipeline'?pipeline():customers();
  if(keep){var q=$('q');q.focus();q.setSelectionRange(q.value.length,q.value.length);}
}
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.id==='refresh'){load();return}
  if(b.dataset.go)S.section=b.dataset.go;
  else if(b.dataset.type)S.type=b.dataset.type;
  else if(b.dataset.sel)S.sel=b.dataset.sel;
  else if(b.dataset.adv){
    var id=b.dataset.adv,to=b.dataset.to;b.disabled=true;
    fetch('/api/orders',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,stage:to})})
    .then(function(r){if(!r.ok)throw 0;ORDERS.forEach(function(o){if(o.id===id)o.stage=to});render();})
    .catch(function(){$('status').style.color='#B00020';$('status').textContent='Could not update the order. Try again.';b.disabled=false;});
    return;
  } else return;
  render();
});
document.addEventListener('input',function(e){if(e.target.id==='q'){S.search=e.target.value;render();}});
render();load();setInterval(load,60000);
</script>
</body>
</html>
